[package]
name = "toon-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasmi = "0.40"

[dev-dependencies]
wat = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
